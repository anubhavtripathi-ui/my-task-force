name: My Task Force Reminders

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  schedule-reminders:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Run reminder scheduler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          exec(Path("scripts/task_reminder_scheduler.py").read_text())
          PY
